<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EV Charging Station Finder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f8f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #16833a;
            margin-bottom: 10px;
        }

        .car {
            font-size: 60px;
            margin: 15px;
        }

        p {
            color: #555;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            background: #16833a;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #0d662c;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f5f5f5;
            color: #333;
            min-height: 50px;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="car">🔋🚗</div>

        <h1>EV Charging Station Finder</h1>

        <p>Find EV charging stations near your location.</p>

        <button onclick="findLocation()">
            📍 Find My Location
        </button>

        <button onclick="findStations()">
            ⚡ Find Charging Stations
        </button>

        <div id="result">
            Your location will appear here.
        </div>

        <div class="footer">
            EV Charging Station Finder
        </div>

    </div>

    <script>

        const result = document.getElementById("result");

        function findLocation() {

            if (!navigator.geolocation) {

                result.innerHTML =
                    "❌ Your browser does not support location.";

                return;
            }

            result.innerHTML =
                "📍 Getting your location...";

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;

                    result.innerHTML =
                        "✅ Location found!<br><br>" +
                        "Latitude: " + latitude +
                        "<br>" +
                        "Longitude: " + longitude;

                },

                function(error) {

                    result.innerHTML =
                        "❌ Unable to get your location.<br>" +
                        "Please allow location permission.";

                }

            );
        }


        function findStations() {

            if (!navigator.geolocation) {

                result.innerHTML =
                    "❌ Location is not supported.";

                return;
            }

            result.innerHTML =
                "📍 Finding nearby charging stations...";

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;

                    const mapURL =
                        "https://www.google.com/maps/search/EV+Charging+Station/@"
                        + latitude + "," + longitude + ",14z";

                    result.innerHTML =
                        "⚡ Charging stations near you:<br><br>" +

                        '<a href="' + mapURL +
                        '" target="_blank">' +

                        '<button>🗺️ Open Nearby Charging Stations</button>' +

                        '</a>';

                },

                function(error) {

                    result.innerHTML =
                        "❌ Please allow location permission.";

                }

            );
        }

    </script>

</body>
</html>
